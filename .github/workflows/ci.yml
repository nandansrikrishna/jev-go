name: Go tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 120s ./...
      - run: go vet ./...
      - run: go install ./cmd/jev
      - run: jev --version
      - run: jev init
      - run: jev validate --questions jev-demo/questions.json --input jev-demo/tickets.jsonl
